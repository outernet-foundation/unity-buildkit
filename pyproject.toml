[project]
name = "unity-buildkit"
version = "0.1.0"
description = "Unity project discovery, build, license, and CI tooling"
requires-python = ">=3.13"
dependencies = [
    "bashrun",
    "typer>=0.17.4",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
]

[dependency-groups]
dev = ["basedpyright>=1.28.0", "ruff>=0.14.11"]

[project.scripts]
activate-unity-license = "unity_buildkit.license:activate_app"
build-unity = "unity_buildkit.build_unity:app"
compile-unity = "unity_buildkit.compile_unity:app"
install = "unity_buildkit.install:app"
lock-unity = "unity_buildkit.lock_unity:app"
test-unity = "unity_buildkit.test_unity:app"
unity-license-tag = "unity_buildkit.license_restore:tag_app"
unity-matrix = "unity_buildkit.matrix:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unity_buildkit"]
include = ["src/unity_buildkit/py.typed", "src/unity_buildkit/third-party/**"]

[tool.uv.sources]
bashrun = { git = "https://github.com/outernet-foundation/bashrun.git", rev = "1a0add1eb9e53e19245dcdda3e2018577b4e1153" }

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src"]
