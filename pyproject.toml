[project]
name = "unity-devkit"
version = "0.0.0.dev0"
description = "Unity build, license, and CI tooling"
requires-python = ">=3.13"
dependencies = [
    "bashrun>=0.1.0",
    "ci-devkit>=0.1.0",
    "typer>=0.17.4",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
]

[dependency-groups]
dev = ["basedpyright>=1.39.10", "ruff>=0.14.11", "pytest>=8.0.0"]

[project.scripts]
activate-unity-license = "unity_devkit.license:activate_app"
build-unity = "unity_devkit.build_unity:app"
compile-unity = "unity_devkit.compile_unity:app"
install = "unity_devkit.install:app"
lock-unity = "unity_devkit.lock_unity:app"
test-unity = "unity_devkit.test_unity:app"
unity-license-tag = "unity_devkit.license_restore:tag_app"
unity-matrix = "unity_devkit.matrix:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unity_devkit"]
include = ["src/unity_devkit/py.typed"]

[tool.uv.sources]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.python-devkit.preflight]
tests = true
